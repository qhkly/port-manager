[package]
name = "port-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "port_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "fs", "sync", "time", "net", "process"] }
sysinfo = "0.32"
chrono = "0.4"
